name: Infotag Autonomous Research & Publishing Pipeline

on:
  schedule:
    # Scheduled daily at 06:00 East Africa Time (EAT / UTC+3) = 03:00 UTC
    # GitHub Actions executes the cadence check daily to evaluate continuous 72-hour intervals
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Bypass 72-hour interval check and force immediate execution'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Execute research and validation without committing or pushing changes'
        required: false
        type: boolean
        default: false
      lookback_days:
        description: 'Research coverage lookback window in days'
        required: false
        type: string
        default: '3'

permissions:
  contents: write

concurrency:
  group: infotag-publishing
  cancel-in-progress: false

jobs:
  research-and-publish:
    name: Autonomous Intelligence & Publishing Cycle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Automated Quality & Regression Tests
        run: |
          pytest tests/ -v

      - name: Evaluate 72-Hour Publishing Cadence
        id: cadence
        run: |
          python -m automation.interval_checker --github-output ${{ (github.event.inputs.force_run == 'true' || github.event.inputs.force_run == true) && '--force' || '' }}

      - name: Execute Autonomous Research & Publishing Engine
        if: steps.cadence.outputs.is_due == 'true' || github.event.inputs.force_run == 'true' || github.event.inputs.force_run == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INFOTAG_TIMEZONE: Africa/Nairobi
          INFOTAG_PUBLISHING_INTERVAL_HOURS: 72.0
        run: |
          python -m automation.run_pipeline \
            ${{ (github.event.inputs.force_run == 'true' || github.event.inputs.force_run == true) && '--force' || '' }} \
            ${{ (github.event.inputs.dry_run == 'true' || github.event.inputs.dry_run == true) && '--dry-run' || '' }} \
            --lookback-days ${{ github.event.inputs.lookback_days || '3' }}

      - name: Push Committed Updates to Main Branch
        if: steps.cadence.outputs.is_due == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git push origin HEAD:main || echo "Remote push handled by internal publisher or no pending changes."

      - name: Generate GitHub Actions Step Summary
        if: always()
        run: |
          echo "## Infotag Autonomous Update Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cadence Evaluated Due:** \`${{ steps.cadence.outputs.is_due || 'N/A' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Elapsed Hours Since Prior Update:** \`${{ steps.cadence.outputs.elapsed_hours || 'N/A' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Force Run Active:** \`${{ github.event.inputs.force_run || 'false' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f Management/Automation/AUTOMATION-STATUS.md ]; then
            head -n 25 Management/Automation/AUTOMATION-STATUS.md >> $GITHUB_STEP_SUMMARY
          fi
